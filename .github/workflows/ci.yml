name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORG: crabsense
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet sonarscanner begin \
            /k:"CrabSense_CrabSenseBE" \
            /o:"${{ env.SONAR_ORG }}" \
            /d:sonar.token="${{ env.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**,**/publish*/**,**/demo-qrs/**" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs"

      - name: Restore
        run: dotnet restore CrabSenseBE.sln

      - name: Build
        run: dotnet build CrabSenseBE.sln -c Release --no-restore

      - name: Test
        run: |
          dotnet test tests/CrabSenseBE.UnitTests/CrabSenseBE.UnitTests.csproj \
            -c Release --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Install PostgreSQL and EF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          dotnet tool install --global dotnet-ef --version 8.0.22

      - name: PostgreSQL concurrency and integrity tests
        shell: pwsh
        run: ./tests/PostgresIntegration/run-hotfix-tests.ps1

      - name: Validate production publish and migration bundle (no VPS)
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DOTNET_ENVIRONMENT: Production
          Jwt__Secret: ci-design-time-only-not-a-runtime-secret-2026
          ConnectionStrings__DefaultConnection: Host=localhost;Database=design_only;Username=postgres
        run: |
          dotnet publish src/CrabSenseBE.Api/CrabSenseBE.Api.csproj -c Release -r linux-x64 --self-contained false -o /tmp/crabsense-publish
          dotnet ef migrations bundle --project src/CrabSenseBE.Infrastructure/CrabSenseBE.Infrastructure.csproj --startup-project src/CrabSenseBE.Api/CrabSenseBE.Api.csproj --configuration Release --self-contained -r linux-x64 --output /tmp/crabsense-publish/efbundle
          test -s /tmp/crabsense-publish/CrabSenseBE.Api.dll
          test -s /tmp/crabsense-publish/efbundle
          /tmp/crabsense-publish/efbundle --help

      - name: Full clean and legacy EF migration tests (including production bundle)
        shell: pwsh
        run: ./tests/PostgresIntegration/run-migration-tests.ps1 -MigrationBundle /tmp/crabsense-publish/efbundle

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

      - name: End SonarCloud
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"
