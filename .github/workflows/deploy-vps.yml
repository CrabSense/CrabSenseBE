name: Deploy VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish & Deploy to VPS
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful CI for exact commit
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const workflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml'
            });
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow.data.id,
              head_sha: process.env.TARGET_SHA,
              status: 'completed',
              per_page: 20
            });
            const passed = runs.data.workflow_runs.some(run =>
              run.conclusion === 'success' && run.head_sha === process.env.TARGET_SHA);
            if (!passed) {
              core.setFailed(`Commit ${process.env.TARGET_SHA} has no successful CI run.`);
            }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish linux-x64
        run: |
          dotnet publish src/CrabSenseBE.Api/CrabSenseBE.Api.csproj \
            -c Release -r linux-x64 --self-contained false \
            -o ./publish

      - name: Build controlled EF migration bundle
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.8
          dotnet ef migrations bundle \
            --project src/CrabSenseBE.Infrastructure/CrabSenseBE.Infrastructure.csproj \
            --startup-project src/CrabSenseBE.Api/CrabSenseBE.Api.csproj \
            --configuration Release --self-contained -r linux-x64 \
            --output ./publish/efbundle

      - name: Verify latest migration supports application rollback
        run: |
          set -euo pipefail
          mapfile -t migrations < <(
            dotnet ef migrations list --no-connect \
              --project src/CrabSenseBE.Infrastructure/CrabSenseBE.Infrastructure.csproj \
              --startup-project src/CrabSenseBE.Api/CrabSenseBE.Api.csproj \
              --configuration Release |
            awk '/^[0-9]{14}_/ {print $1}'
          )
          if [ "${#migrations[@]}" -lt 2 ]; then
            echo "Cannot determine the latest migration pair." >&2
            exit 1
          fi
          previous="${migrations[$((${#migrations[@]}-2))]}"
          latest="${migrations[$((${#migrations[@]}-1))]}"
          dotnet ef migrations script "$previous" "$latest" --idempotent \
            --project src/CrabSenseBE.Infrastructure/CrabSenseBE.Infrastructure.csproj \
            --startup-project src/CrabSenseBE.Api/CrabSenseBE.Api.csproj \
            --configuration Release --output latest-migration.sql
          if grep -Eiq '\b(DROP (TABLE|COLUMN)|RENAME (TABLE|COLUMN)|ALTER COLUMN|TRUNCATE|DELETE FROM)\b' latest-migration.sql; then
            echo "Latest migration is destructive and cannot use app-only rollback." >&2
            exit 1
          fi

      - name: Inject runtime config (secrets)
        env:
          APPSETTINGS_LOCAL_JSON: ${{ secrets.APPSETTINGS_LOCAL_JSON }}
          GOOGLE_DRIVE_SA_JSON: ${{ secrets.GOOGLE_DRIVE_SA_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${APPSETTINGS_LOCAL_JSON:-}" ]; then
            echo "Missing secret APPSETTINGS_LOCAL_JSON" >&2
            exit 1
          fi
          printf '%s' "$APPSETTINGS_LOCAL_JSON" > ./publish/appsettings.Local.json
          mkdir -p ./publish/secrets
          if [ -n "${GOOGLE_DRIVE_SA_JSON:-}" ]; then
            printf '%s' "$GOOGLE_DRIVE_SA_JSON" > ./publish/secrets/google-drive-sa.json
            chmod 600 ./publish/secrets/google-drive-sa.json
          fi
          # Ensure public bind
          python3 - <<'PY'
          import json
          p='./publish/appsettings.Local.json'
          d=json.load(open(p, encoding='utf-8-sig'))
          d['Urls']='http://0.0.0.0:5080'
          ms=d.setdefault('MediaStorage', {})
          if not ms.get('Provider'):
              ms['Provider']='GoogleDrive' if d.get('GoogleDrive') else 'Local'
          json.dump(d, open(p,'w', encoding='utf-8'), indent=2)
          print('Local config ready, provider=', d.get('MediaStorage',{}).get('Provider'))
          PY
          tar -czf crabsense-api.tar.gz -C ./publish .

      - name: Upload package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "crabsense-api.tar.gz"
          target: "/tmp/"

      - name: Backup, migrate, deploy and health-check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -euo pipefail
            # App publish cho net8.0 nhung VPS co the chi co runtime 9.x => exit 150.
            # Cai san runtime 8.0 (idempotent, khong lam gi neu da co).
            if ! dotnet --list-runtimes 2>/dev/null | grep -q 'Microsoft.NETCore.App 8\.'; then
              echo "Thieu runtime .NET 8 tren VPS - dang cai..."
              export DEBIAN_FRONTEND=noninteractive
              apt-get install -y --no-install-recommends dotnet-runtime-8.0 aspnetcore-runtime-8.0
              dotnet --list-runtimes
            fi
            rm -rf /opt/crabsense-api.next
            mkdir -p /opt/crabsense-api.next
            tar -xzf /tmp/crabsense-api.tar.gz -C /opt/crabsense-api.next
            chmod 600 /opt/crabsense-api.next/secrets/google-drive-sa.json 2>/dev/null || true
            DB_CONNECTION="$(python3 - <<'PY'
            import json
            d=json.load(open('/opt/crabsense-api.next/appsettings.Local.json', encoding='utf-8-sig'))
            print(d.get('ConnectionStrings',{}).get('DefaultConnection',''))
            PY
            )"
            if [ -z "$DB_CONNECTION" ]; then
              echo "Missing production database connection" >&2
              exit 1
            fi
            mkdir -p /var/lib/crabsense/backups
            chmod 700 /var/lib/crabsense/backups
            pg_dump "$DB_CONNECTION" \
              --format=custom \
              --file="/var/lib/crabsense/backups/predeploy-$(date -u +%Y%m%dT%H%M%SZ).dump"
            chmod +x /opt/crabsense-api.next/efbundle
            /opt/crabsense-api.next/efbundle --connection "$DB_CONNECTION"
            unset DB_CONNECTION
            systemctl stop crabsense-api || true
            rm -rf /opt/crabsense-api.previous
            if [ -d /opt/crabsense-api ]; then
              mv /opt/crabsense-api /opt/crabsense-api.previous
            fi
            mv /opt/crabsense-api.next /opt/crabsense-api
            mkdir -p /opt/crabsense-api/logs /opt/crabsense-api/media-storage
            printf '%s\n' \
              '[Unit]' \
              'Description=CrabSense BE API' \
              'After=network.target' \
              '' \
              '[Service]' \
              'WorkingDirectory=/opt/crabsense-api' \
              'ExecStart=/usr/bin/dotnet /opt/crabsense-api/CrabSenseBE.Api.dll --urls http://0.0.0.0:5080' \
              'Restart=always' \
              'RestartSec=5' \
              'Environment=ASPNETCORE_ENVIRONMENT=Production' \
              'Environment=DOTNET_ENVIRONMENT=Production' \
              'Environment=ASPNETCORE_URLS=http://0.0.0.0:5080' \
              'Environment=DOTNET_PRINT_TELEMETRY_MESSAGE=false' \
              '' \
              '[Install]' \
              'WantedBy=multi-user.target' \
              > /etc/systemd/system/crabsense-api.service
            systemctl daemon-reload
            systemctl enable crabsense-api
            systemctl restart crabsense-api
            for i in 1 2 3 4 5 6 8 10; do
              sleep $i
              if curl -fsS http://127.0.0.1:5080/health >/dev/null 2>&1; then
                echo "health ok after ${i}s wait"
                break
              fi
            done
            if ! systemctl is-active --quiet crabsense-api || ! curl -fsS http://127.0.0.1:5080/health >/dev/null; then
              echo "Health check failed; restoring previous application package."
              echo "The migration gate requires this package to remain schema-compatible."
              echo "Database schema is retained; automatic production database restore is intentionally disabled."
              journalctl -u crabsense-api -n 40 --no-pager
              systemctl stop crabsense-api || true
              rm -rf /opt/crabsense-api.failed
              mv /opt/crabsense-api /opt/crabsense-api.failed
              if [ -d /opt/crabsense-api.previous ]; then
                mv /opt/crabsense-api.previous /opt/crabsense-api
                systemctl restart crabsense-api
              fi
              exit 1
            fi
            curl -fsS http://127.0.0.1:5080/health
            echo
            echo DEPLOY_OK
