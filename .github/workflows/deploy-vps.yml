name: Deploy VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish & Deploy to VPS
    # This VPS is FE/App-only (owner confirmed no connected physical devices).
    # Always enforce hardware-control-disabled mode; live cutover needs a separate reviewed change.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful CI for exact commit
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const workflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml'
            });
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow.data.id,
              head_sha: process.env.TARGET_SHA,
              status: 'completed',
              per_page: 20
            });
            const passed = runs.data.workflow_runs.some(run =>
              run.conclusion === 'success' && run.head_sha === process.env.TARGET_SHA &&
              run.event === 'push' && run.head_branch === 'main');
            const main = await github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'});
            if (main.data.commit.sha !== process.env.TARGET_SHA) {
              core.setFailed('Refusing stale or non-main deployment.');
            }
            if (!passed) {
              core.setFailed(`Commit ${process.env.TARGET_SHA} has no successful CI run.`);
            }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish linux-x64
        run: |
          dotnet publish src/CrabSenseBE.Api/CrabSenseBE.Api.csproj \
            -c Release -r linux-x64 --self-contained false \
            -o ./publish

      - name: Build controlled EF migration bundle
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DOTNET_ENVIRONMENT: Production
          Jwt__Secret: ci-design-time-only-not-a-runtime-secret-2026
          ConnectionStrings__DefaultConnection: Host=localhost;Database=design_only;Username=postgres
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.22
          dotnet ef migrations bundle \
            --project src/CrabSenseBE.Infrastructure/CrabSenseBE.Infrastructure.csproj \
            --startup-project src/CrabSenseBE.Api/CrabSenseBE.Api.csproj \
            --configuration Release --self-contained -r linux-x64 \
            --output ./publish/efbundle

      - name: Record migration version and reject destructive latest migration
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DOTNET_ENVIRONMENT: Production
          Jwt__Secret: ci-design-time-only-not-a-runtime-secret-2026
          ConnectionStrings__DefaultConnection: Host=localhost;Database=design_only;Username=postgres
        run: |
          set -euo pipefail
          mapfile -t migrations < <(
            dotnet ef migrations list --no-connect \
              --project src/CrabSenseBE.Infrastructure/CrabSenseBE.Infrastructure.csproj \
              --startup-project src/CrabSenseBE.Api/CrabSenseBE.Api.csproj \
              --configuration Release |
            awk 'substr($1, 1, 14) ~ /^[0-9]+$/ && substr($1, 15, 1) == "_" {print $1}'
          )
          if [ "${#migrations[@]}" -lt 2 ]; then
            echo "Cannot determine the latest migration pair." >&2
            exit 1
          fi
          previous="${migrations[$((${#migrations[@]}-2))]}"
          latest="${migrations[$((${#migrations[@]}-1))]}"
          printf '%s\n' "$latest" > ./publish/.schema-migration
          dotnet ef migrations script "$previous" "$latest" --idempotent \
            --project src/CrabSenseBE.Infrastructure/CrabSenseBE.Infrastructure.csproj \
            --startup-project src/CrabSenseBE.Api/CrabSenseBE.Api.csproj \
            --configuration Release --output latest-migration.sql
          if grep -Eiq '\b(DROP (TABLE|COLUMN)|RENAME (TABLE|COLUMN)|ALTER COLUMN|TRUNCATE|DELETE FROM)\b' latest-migration.sql; then
            echo "Latest migration is destructive and cannot use app-only rollback." >&2
            exit 1
          fi

      - name: Inject runtime config (secrets)
        env:
          APPSETTINGS_LOCAL_JSON: ${{ secrets.APPSETTINGS_LOCAL_JSON }}
          GOOGLE_DRIVE_SA_JSON: ${{ secrets.GOOGLE_DRIVE_SA_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${APPSETTINGS_LOCAL_JSON:-}" ]; then
            echo "Missing secret APPSETTINGS_LOCAL_JSON" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$APPSETTINGS_LOCAL_JSON" > ./publish/appsettings.Local.json
          mkdir -p ./publish/secrets
          if [ -n "${GOOGLE_DRIVE_SA_JSON:-}" ]; then
            printf '%s' "$GOOGLE_DRIVE_SA_JSON" > ./publish/secrets/google-drive-sa.json
            chmod 600 ./publish/secrets/google-drive-sa.json
          fi
          # Ensure public bind
          python3 - <<'PY'
          import json
          p='./publish/appsettings.Local.json'
          d=json.load(open(p, encoding='utf-8-sig'))
          d['Urls']='http://0.0.0.0:5080'
          d.setdefault('EdgeSync', {})['ControlDisabled']=True
          d['EdgeSync']['AllowLegacySharedKey']=False
          d.setdefault('RasAutomation', {})['FirmwareInterlockVerified']=False
          ms=d.setdefault('MediaStorage', {})
          if not ms.get('Provider'):
              ms['Provider']='GoogleDrive' if d.get('GoogleDrive') else 'Local'
          if ms.get('Provider','').lower() == 'local':
              root = ms.get('LocalRoot') or 'media-storage'
              if root in ('media-storage', './media-storage'):
                  ms['LocalRoot']='/var/lib/crabsense/media-storage'
              elif not __import__('os').path.isabs(root):
                  raise SystemExit('Local media root must be absolute or the default media-storage.')
          json.dump(d, open(p,'w', encoding='utf-8'), indent=2)
          print('Local config ready, provider=', d.get('MediaStorage',{}).get('Provider'))
          PY
          touch ./publish/.edge-protocol-v2 ./publish/.hardware-control-disabled
          chmod 600 ./publish/appsettings.Local.json
          tar -czf crabsense-api.tar.gz -C ./publish .

      - name: Recheck main before upload
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const main = await github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'});
            if (main.data.commit.sha !== process.env.TARGET_SHA) core.setFailed('Main advanced while packaging; refusing stale deployment.');

      - name: Upload package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "crabsense-api.tar.gz"
          target: "/tmp/"

      - name: Backup, migrate, deploy and health-check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -euo pipefail
            # App publish cho net8.0 nhung VPS co the chi co runtime 9.x => exit 150.
            # Cai san runtime 8.0 (idempotent, khong lam gi neu da co).
            if ! dotnet --list-runtimes 2>/dev/null | grep -q 'Microsoft.NETCore.App 8\.' || ! dotnet --list-runtimes 2>/dev/null | grep -q 'Microsoft.AspNetCore.App 8\.'; then
              echo "Thieu runtime .NET 8 tren VPS - dang cai..."
              export DEBIAN_FRONTEND=noninteractive
              apt-get install -y --no-install-recommends dotnet-runtime-8.0 aspnetcore-runtime-8.0
              dotnet --list-runtimes
            fi
            rm -rf /opt/crabsense-api.next
            mkdir -p /opt/crabsense-api.next
            tar -xzf /tmp/crabsense-api.tar.gz -C /opt/crabsense-api.next
            chmod 600 /opt/crabsense-api.next/secrets/google-drive-sa.json 2>/dev/null || true
            test -f /opt/crabsense-api.next/.hardware-control-disabled
            DB_CONNECTION="$(python3 - <<'PY'
            import json
            d=json.load(open('/opt/crabsense-api.next/appsettings.Local.json', encoding='utf-8-sig'))
            print(d.get('ConnectionStrings',{}).get('DefaultConnection',''))
            PY
            )"
            if [ -z "$DB_CONNECTION" ]; then
              echo "Missing production database connection" >&2
              exit 1
            fi
            # Quiesce the previous API before the final backup. Recover it only if
            # failure happens before any migration starts.
            OLD_WAS_ACTIVE=false
            MIGRATION_STARTED=false
            if systemctl is-active --quiet crabsense-api; then OLD_WAS_ACTIVE=true; fi
            trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$MIGRATION_STARTED" = false ] && [ "$OLD_WAS_ACTIVE" = true ]; then systemctl start crabsense-api || true; fi; exit "$rc"' EXIT
            if systemctl cat crabsense-api >/dev/null 2>&1; then
              systemctl stop crabsense-api
              if systemctl is-active --quiet crabsense-api; then exit 1; fi
            fi
            mkdir -p /var/lib/crabsense/backups
            chmod 700 /var/lib/crabsense/backups
            # Npgsql connection strings are not libpq connection strings.
            # Pass credentials via the child process environment, never CLI arguments.
            umask 077
            BACKUP_FILE="/var/lib/crabsense/backups/predeploy-$(date -u +%Y%m%dT%H%M%SZ).dump"
            python3 - "$BACKUP_FILE" <<'PY'
            import json
            import os
            import re
            import subprocess
            import sys

            with open('/opt/crabsense-api.next/appsettings.Local.json', encoding='utf-8-sig') as f:
                connection = json.load(f)['ConnectionStrings']['DefaultConnection']

            # Support ADO.NET quoted values, including embedded semicolons and doubled quotes.
            pattern = re.compile(r"""\s*([^=;]+?)\s*=\s*(?:"((?:[^"]|"")*)"|'((?:[^']|'')*)'|([^;]*?))\s*(?:;|$)""")
            values = {}
            pos = 0
            while pos < len(connection):
                if not connection[pos:].strip(' ;\t\r\n'):
                    break
                if connection[pos] == ';':
                    pos += 1
                    continue
                match = pattern.match(connection, pos)
                if not match:
                    sys.exit('Cannot parse production database connection for backup.')
                key, double, single, bare = match.groups()
                key = re.sub(r'\s+', '', key).lower()
                value = double.replace('""', '"') if double is not None else (
                    single.replace("''", "'") if single is not None else bare.strip())
                values[key] = value
                pos = match.end()

            def get(*keys, default=None):
                return next((values[key] for key in keys if key in values), default)

            env = {key: value for key, value in os.environ.items() if not key.startswith('PG')}
            required = {
                'PGHOST': get('host', 'server'),
                'PGDATABASE': get('database', 'initialcatalog'),
                'PGUSER': get('username', 'userid', 'user', 'uid'),
            }
            if not all(required.values()):
                sys.exit('Production backup requires explicit host, database and username.')
            env.update(required)
            env['PGPORT'] = get('port', default='5432')
            env['PGPASSWORD'] = get('password', 'pwd', default='')
            mode = re.sub(r'[\s_-]+', '', get('sslmode', default='Prefer')).lower()
            modes = {'disable': 'disable', 'allow': 'allow', 'prefer': 'prefer',
                     'require': 'require', 'verifyca': 'verify-ca', 'verifyfull': 'verify-full'}
            if mode not in modes:
                sys.exit('Unsupported SSL mode in production database connection.')
            env['PGSSLMODE'] = modes[mode]
            for option, variable in {
                'rootcertificate': 'PGSSLROOTCERT',
                'sslcertificate': 'PGSSLCERT',
                'sslkey': 'PGSSLKEY',
                'sslpassword': 'PGSSLKEYPASS',
                'passfile': 'PGPASSFILE',
            }.items():
                if values.get(option):
                    env[variable] = values[option]
            # Do not silently ignore security settings that could change the target or TLS.
            if get('integratedsecurity', default='false').lower() in ('true', 'yes', '1'):
                sys.exit('Integrated security is not supported by the backup converter.')
            if get('channelbinding'):
                binding = get('channelbinding').lower()
                if binding not in ('disable', 'prefer', 'require'):
                    sys.exit('Unsupported channel binding mode.')
                env['PGCHANNELBINDING'] = binding
            if get('targetsessionattributes'):
                target = get('targetsessionattributes').lower()
                if target not in ('any', 'read-write', 'read-only', 'primary', 'standby', 'prefer-standby'):
                    sys.exit('Unsupported target session attributes.')
                env['PGTARGETSESSIONATTRS'] = target

            # Debian/Ubuntu pg_wrapper may select a different version for pg_dump
            # and pg_restore. Use real binaries from the same installed client.
            from pathlib import Path
            import shutil

            def client_version(binary):
                result = subprocess.run([str(binary), '--version'], check=True,
                                        text=True, capture_output=True)
                match = re.search(r'\(PostgreSQL\)\s+(\d+(?:\.\d+)+|\d+)', result.stdout)
                if not match:
                    raise ValueError('Unrecognized PostgreSQL client version')
                return tuple(int(part) for part in match.group(1).split('.'))

            candidates = set()
            for base in (Path('/usr/lib/postgresql'), Path('/usr/pgsql'),
                         Path('/usr/local/pgsql'), Path('/opt/postgresql')):
                candidates.update(base.glob('*/bin'))
                candidates.add(base / 'bin')
            candidates.update(Path('/usr').glob('pgsql-*/bin'))
            candidates.update(Path('/usr/local').glob('pgsql-*/bin'))
            for binary in ('pg_dump', 'pg_restore'):
                found = shutil.which(binary, path=env.get('PATH'))
                if found:
                    candidates.add(Path(found).parent)
                    candidates.add(Path(found).resolve().parent)

            pairs = []
            for directory in sorted(candidates):
                dump = directory / 'pg_dump'
                restore = directory / 'pg_restore'
                if not (os.access(dump, os.X_OK) and os.access(restore, os.X_OK)):
                    continue
                # Avoid pg_wrapper symlinks even if --version happens to agree.
                if any(binary.resolve().name == 'pg_wrapper' for binary in (dump, restore)):
                    continue
                try:
                    dump_version = client_version(dump)
                    restore_version = client_version(restore)
                except (OSError, ValueError, subprocess.CalledProcessError):
                    continue
                if dump_version == restore_version:
                    pairs.append((dump_version, str(directory), str(dump), str(restore)))

            if not pairs:
                sys.exit('No matching PostgreSQL client binaries found. Install a compatible PostgreSQL client package on the VPS.')
            version, directory, pg_dump, pg_restore = max(pairs)
            print('Using PostgreSQL client ' + '.'.join(map(str, version)) + ' from ' + directory, flush=True)

            backup = sys.argv[1]
            partial = backup + '.partial'
            try:
                subprocess.run([pg_dump, '--no-password', '--format=custom', '--file=' + partial],
                               env=env, check=True)
                subprocess.run([pg_restore, '--list', partial],
                               stdout=subprocess.DEVNULL, check=True)
                if not os.path.getsize(partial):
                    sys.exit('Database backup is empty.')
                os.replace(partial, backup)
            finally:
                if os.path.exists(partial):
                    os.unlink(partial)
            print('Database backup created and archive verified.')
            PY
            test -s "$BACKUP_FILE"
            # Preserve default local media outside versioned application directories.
            python3 - <<'PY'
            import json, pathlib, shutil
            config=json.load(open('/opt/crabsense-api.next/appsettings.Local.json'))
            media=config.get('MediaStorage', {})
            if media.get('Provider','').lower() == 'local' and media.get('LocalRoot') == '/var/lib/crabsense/media-storage':
                target=pathlib.Path('/var/lib/crabsense/media-storage')
                target.mkdir(parents=True, exist_ok=True)
                old=pathlib.Path('/opt/crabsense-api/media-storage')
                if old.is_dir() and not old.is_symlink():
                    # Do not overwrite newer persistent assets during later deployments.
                    for file in old.rglob('*'):
                        if file.is_file():
                            dest=target/file.relative_to(old)
                            dest.parent.mkdir(parents=True, exist_ok=True)
                            if not dest.exists(): shutil.copy2(file, dest)
            PY
            chmod +x /opt/crabsense-api.next/efbundle
            MIGRATION_STARTED=true
            # EF uses the startup application's configuration. Run from the
            # staged package so appsettings.Local.json and relative paths resolve.
            (
              cd /opt/crabsense-api.next
              export ASPNETCORE_ENVIRONMENT=Production
              export DOTNET_ENVIRONMENT=Production
              export ASPNETCORE_CONTENTROOT="$PWD"
              export DOTNET_CONTENTROOT="$PWD"
              test -r appsettings.Local.json
              echo "Running EF migration bundle from staged application directory."
              export ConnectionStrings__DefaultConnection="$DB_CONNECTION"
              ./efbundle
            )
            unset DB_CONNECTION
            rm -rf /opt/crabsense-api.previous
            if [ -d /opt/crabsense-api ]; then
              mv /opt/crabsense-api /opt/crabsense-api.previous
            fi
            mv /opt/crabsense-api.next /opt/crabsense-api
            mkdir -p /opt/crabsense-api/logs /opt/crabsense-api/media-storage
            printf '%s\n' \
              '[Unit]' \
              'Description=CrabSense BE API' \
              'After=network.target' \
              '' \
              '[Service]' \
              'WorkingDirectory=/opt/crabsense-api' \
              'ExecStart=/usr/bin/dotnet /opt/crabsense-api/CrabSenseBE.Api.dll --urls http://0.0.0.0:5080' \
              'Restart=always' \
              'RestartSec=5' \
              'Environment=ASPNETCORE_ENVIRONMENT=Production' \
              'Environment=DOTNET_ENVIRONMENT=Production' \
              'Environment=EdgeSync__ControlDisabled=true' \
              'Environment=EdgeSync__AllowLegacySharedKey=false' \
              'Environment=RasAutomation__FirmwareInterlockVerified=false' \
              'Environment=ASPNETCORE_URLS=http://0.0.0.0:5080' \
              'Environment=DOTNET_PRINT_TELEMETRY_MESSAGE=false' \
              '' \
              '[Install]' \
              'WantedBy=multi-user.target' \
              > /etc/systemd/system/crabsense-api.service
            systemctl daemon-reload
            systemctl enable crabsense-api
            systemctl restart crabsense-api
            for i in 1 2 3 4 5 6 8 10; do
              sleep $i
              if curl -fsS http://127.0.0.1:5080/health >/dev/null 2>&1; then
                echo "health ok after ${i}s wait"
                break
              fi
            done
            if ! systemctl is-active --quiet crabsense-api || ! curl -fsS http://127.0.0.1:5080/health >/dev/null || ! curl -fsS http://127.0.0.1:5080/health/edge-control | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("hardwareControlDisabled") is True else 1)'; then
              echo "Health check failed; restoring previous application package."
              echo "The migration gate requires this package to remain schema-compatible."
              echo "Database schema is retained; automatic production database restore is intentionally disabled."
              journalctl -u crabsense-api -n 40 --no-pager
              systemctl stop crabsense-api || true
              rm -rf /opt/crabsense-api.failed
              mv /opt/crabsense-api /opt/crabsense-api.failed
              if [ -f /opt/crabsense-api.previous/.hardware-control-disabled ] && \
                 [ -f /opt/crabsense-api.previous/.edge-protocol-v2 ] && \
                 [ -f /opt/crabsense-api.previous/.schema-migration ] && \
                 cmp -s /opt/crabsense-api.previous/.schema-migration /opt/crabsense-api.failed/.schema-migration; then
                mv /opt/crabsense-api.previous /opt/crabsense-api
                systemctl restart crabsense-api
              else
                echo 'Protocol-1 application rollback is unsafe after v2 migration; unverified schema compatibility also requires manual recovery.' >&2
              fi
              exit 1
            fi
            curl -fsS http://127.0.0.1:5080/health
            echo
            curl -fsS http://127.0.0.1:5080/health/edge-control
            echo
            echo DEPLOY_OK
